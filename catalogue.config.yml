title: Title
description: >
  A description of your practice, your interests, and the work collected here.
  This is a place to say who you are, what connects these projects, and what a
  visitor should take away. A few sentences is enough. Write it like the
  opening paragraph of a book.
author: Your Name
accent_color: "#1a1a1a"
# url: https://yourname.github.io/catalogue  # required for og:image absolute URLs

# Link previews (the card a URL becomes in iMessage, Slack, X…). They need
# `url` above. `accent_color` doubles as theme-color (override: theme_color).
# icon: img/icon.png          # square site icon (PNG, JPEG or SVG, 180 px or more):
#                             # the favicon, apple-touch-icon, and the preview icon
# preview:
#   background: "#f2f2f2"     # behind letterboxed images in generated 1200×630 cards
#   icon_background: "#ffffff" # behind icons; iOS shows transparency as black
#   image: img/card.png       # the card for the index and pages; default: generated
#                             # from the icon and the title
#   image_alt: Your Name's catalogue
#   post_layout: true         # iMessage's post layout (description, icon beside image)
#   fonts:                    # for the composed X cards: font files or package paths
#     title: "@fontsource/inter/files/inter-latin-600-normal.woff"
#     text: "@fontsource/inter/files/inter-latin-400-normal.woff"
#     label: "@fontsource/inter/files/inter-latin-500-normal.woff"
#   colors: { background: "#ffffff", text: "#1a1a1a", muted: "#767676", panel: "#f2f2f2" }
# wordmark: img/wordmark.svg  # the site's wordmark, signing the X cards (else the title)

# Where things live. The defaults put the catalogue index at the site root and
# each entry at /p/<slug>/. Set catalog_path to mount the catalogue elsewhere
# (e.g. /work/) when a homepage page owns /.
# home_path: /
# catalog_path: /
# entry_path: /p/

# Pages linked in the header, as {label, path}. Empty means no nav. A page
# left out of this list is unlisted: reachable by URL, never linked.
nav: []

# Index groups, in order. Each entry's `category` names one; with a single
# group (the default) entries don't need the field and the index has no
# headings. Ids or {id, label}:
# categories:
#   - { id: work, label: Work }
#   - { id: writing, label: Writing }

# Entries that live in other repos. Each repo keeps its entry in a hidden
# folder at its root (source_dir) and `npm run import` copies it here.
# source_dir: .artifact
sources: []
#   - repo: you/your-project

# Extra `links` keys beyond the built-in ones (app, app_store, mac_app_store,
# testflight, play, play_testing, chrome_web_store, source). hosts limits
# where the link may point; omit it to allow any https URL.
# link_kinds:
#   itch: { label: itch.io, hosts: [itch.io] }

# Stack: github-pages | cloudflare
stack: github-pages

# Only needed for the cloudflare stack:
# cloudflare:
#   pages_project: your-project-name
#   r2_bucket: your-bucket-name             # used by `npm run sync`
#   r2_media_base_url: https://media.yourdomain.com
